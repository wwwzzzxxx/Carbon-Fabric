plugins { id 'net.fabricmc.fabric-loom-remap' version '1.18.4' }
version = mod_version
group = 'first.carbon'
base { archivesName = 'carbon' }
repositories { mavenCentral(); maven { url = 'https://api.modrinth.com/maven' } }
loom { accessWidenerPath = file('src/main/resources/carbon.accesswidener') }
dependencies {
    minecraft 'com.mojang:minecraft:1.18.2'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2'
    implementation 'org.joml:joml:1.10.8'
    include 'org.joml:joml:1.10.8'
    modCompileOnly 'maven.modrinth:iris:1.6.11+1.18.2'
}
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.withType(Jar).configureEach { from 'LICENSE' }
