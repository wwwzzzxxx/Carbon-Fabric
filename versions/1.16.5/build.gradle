plugins { id 'net.fabricmc.fabric-loom-remap' }

version = '1.16.5.9-fabric.14'
group = 'first.carbon'
base { archivesName = 'carbon' }
repositories { mavenCentral() }
loom { accessWidenerPath = file('../../src/legacy/resources/carbon.legacy.accesswidener') }

dependencies {
    minecraft 'com.mojang:minecraft:1.16.5'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.14.25'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.42.0+1.16'
}

def generated = layout.buildDirectory.dir('generated/sources/carbon')
tasks.register('prepareVersionSources', Sync) {
    from('../../src/main/java') { include 'first/carbon/Carbon.java', 'first/carbon/compat/TweakerooVisibility.java' }
    from('../../src/legacy/java')
    into generated
}
sourceSets.main.java.setSrcDirs([generated])
sourceSets.main.resources.setSrcDirs(['../../src/legacy/resources'])
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
tasks.named('compileJava') { dependsOn 'prepareVersionSources' }
tasks.named('sourcesJar') { dependsOn 'prepareVersionSources' }
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.withType(Jar).configureEach { from '../../LICENSE' }
