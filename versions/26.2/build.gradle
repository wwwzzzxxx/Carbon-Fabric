plugins { id 'net.fabricmc.fabric-loom' }
version = '26.2.9-fabric.10'
group = 'first.carbon'
base { archivesName = 'carbon' }
repositories { mavenCentral(); maven { url='https://api.modrinth.com/maven' } }
loom { accessWidenerPath = file('overrides/resources/carbon.accesswidener') }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
    implementation 'org.joml:joml:1.10.8'
    include 'org.joml:joml:1.10.8'
    compileOnly 'maven.modrinth:iris:1.11.4+26.2-fabric'
}
def generated = layout.buildDirectory.dir('generated/carbon')
tasks.register('prepareVersionSources', Exec) {
    inputs.dir '../../src/main'
    inputs.dir '../../src/renderstate'
    inputs.dir 'overrides'
    inputs.file 'patches.json'
    inputs.file '../../tools/prepare_version.py'
    outputs.dir generated
    commandLine 'python', '-X', 'utf8', '../../tools/prepare_version.py', project.projectDir.absolutePath, generated.get().asFile.absolutePath
}
sourceSets.main.java.setSrcDirs([generated.map { it.dir('java') }])
sourceSets.main.java.exclude('first/carbon/mixin/BufferBuilderAccessor.java', 'first/carbon/mixin/ShaderInstanceAccessor.java', 'first/carbon/compat/IrisLayer.java', 'first/carbon/mixin/RenderTypeStateAccessor.java', 'first/carbon/mixin/WindowMixin.java', 'first/carbon/mixin/ItemRendererMixin.java', 'first/carbon/mixin/BufferBuilderMixin.java', 'first/carbon/mixin/BufferSourceMixin.java', 'first/carbon/mixin/SodiumBufferBuilderMixin.java', 'first/carbon/mixin/VertexMultiConsumerMixin.java')
sourceSets.main.resources.setSrcDirs([generated.map { it.dir('resources') }])
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.named('compileJava') { dependsOn 'prepareVersionSources' }
tasks.named('processResources') { dependsOn 'prepareVersionSources' }
tasks.named('sourcesJar') { dependsOn 'prepareVersionSources' }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.withType(Jar).configureEach { from '../../LICENSE' }
